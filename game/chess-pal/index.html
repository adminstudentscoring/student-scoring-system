<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Chess Pal</title>
    <!-- Bump this value on each deploy to force clients to fetch latest assets. -->
    <script>window.__CP_ASSET_VERSION = '20260220-2';</script>
    <link rel="stylesheet" href="styles.css?v=20260220-2">
    <link rel="stylesheet" href="game-styles.css?v=20260220-2">
</head>
<body>
    <div class="cp-app" id="cpApp">
        <aside class="cp-sidebar" id="cpSidebar">
            <div class="cp-side-head">
                <img class="cp-side-logo" src="images/Logo/Logo_1.png" alt="Chess Pal" onerror="this.onerror=null;this.style.display='none';">
            </div>

            <nav class="cp-nav" aria-label="Chess Pal navigation">
                <button class="cp-nav-btn is-active" type="button" data-route="/home">Home</button>
                <button class="cp-nav-btn" type="button" data-route="/mode">Mode</button>
                <button class="cp-nav-btn" type="button" data-route="/team">Team</button>
                <button class="cp-nav-btn" type="button" data-route="/pal">Pal</button>
                <button class="cp-nav-btn" type="button" data-route="/enhance">Enhance</button>
                <button class="cp-nav-btn" type="button" data-route="/storage">Storage</button>
                <button class="cp-nav-btn" type="button" data-route="/shop">Shop</button>
                <button class="cp-nav-btn" type="button" data-route="/settings">Setting</button>
            </nav>

            <div class="cp-sidebar-bottom">
                <div class="cp-player-card" id="cpPlayerCard" aria-label="Player profile">
                    <div class="cp-player-name" id="cpPlayerName">Player</div>
                    <div class="cp-player-level-row">
                        <span class="cp-player-level" id="cpPlayerLevel">Lv.1</span>
                        <span class="cp-player-level-next" id="cpPlayerLevelNext">Next 0</span>
                    </div>
                    <div class="cp-player-expbar" aria-label="Player EXP progress">
                        <div class="cp-player-expfill" id="cpPlayerExpFill"></div>
                    </div>
                </div>
                <div class="cp-coins" id="cpCoinsBar" aria-label="Coins">
                    <div class="cp-coin">
                        <img class="cp-coin-img" src="images/Storage/S001-Gold-Coin.png" alt="Gold coin" onerror="this.onerror=null;if(this.src.indexOf('S002-Gold-Coin.png')===-1){this.src='images/Storage/S002-Gold-Coin.png';return;}this.src='images/Storage/Gold-Coin.png';">
                        <div class="cp-coin-meta">
                            <div class="cp-coin-name">Gold</div>
                            <div class="cp-coin-val" id="cpGoldCoinVal">0</div>
                        </div>
                    </div>
                    <div class="cp-coin">
                        <img class="cp-coin-img" src="images/Storage/S002-Silver-Coin.png" alt="Silver coin" onerror="this.onerror=null;if(this.src.indexOf('S001-Silver-Coin.png')===-1){this.src='images/Storage/S001-Silver-Coin.png';return;}this.src='images/Storage/Silver-Coin.png';">
                        <div class="cp-coin-meta">
                            <div class="cp-coin-name">Silver</div>
                            <div class="cp-coin-val" id="cpSilverCoinVal">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="cp-main" id="cpMain">
            <div class="cp-main-topbar">
                <button class="cp-hamburger" id="cpHamburger" type="button" aria-label="Toggle menu">☰</button>
                <div class="cp-main-title" id="cpMainTitle">Home</div>
                <div class="cp-top-status" id="cpTopStatus" aria-label="Player quick status">
                    <div class="cp-top-level">
                        <div class="cp-top-level-row">
                            <span id="cpTopPlayerLevel">Lv.1</span>
                        </div>
                        <div class="cp-top-expbar" aria-label="Level progress">
                            <div class="cp-top-expfill" id="cpTopPlayerExpFill"></div>
                        </div>
                    </div>
                    <div class="cp-top-coins" aria-label="Coins">
                        <div class="cp-top-coin">
                            <img src="images/Storage/S001-Gold-Coin.png" alt="Gold coin" onerror="this.onerror=null;if(this.src.indexOf('S002-Gold-Coin.png')===-1){this.src='images/Storage/S002-Gold-Coin.png';return;}this.src='images/Storage/Gold-Coin.png';">
                            <span id="cpTopGoldCoinVal">0</span>
                        </div>
                        <div class="cp-top-coin">
                            <img src="images/Storage/S002-Silver-Coin.png" alt="Silver coin" onerror="this.onerror=null;if(this.src.indexOf('S001-Silver-Coin.png')===-1){this.src='images/Storage/S001-Silver-Coin.png';return;}this.src='images/Storage/Silver-Coin.png';">
                            <span id="cpTopSilverCoinVal">0</span>
                        </div>
                    </div>
                </div>
                <div class="cp-top-tools" id="cpTopTools"></div>
            </div>
            <div class="cp-top-popovers" id="cpTopPopovers"></div>
            <div id="cpPageContainer" class="cp-container"></div>
        </main>
    </div>

    <div class="cp-overlay" id="cpOverlay" aria-hidden="true"></div>

    <script src="config.js?v=20260220-2"></script>
    <script src="/auth.js?v=20260220-2"></script>
    <script src="chess-pal.js?v=20260220-2"></script>
    <script src="hero.js?v=20260220-2"></script>
    <script src="monster.js?v=20260220-2"></script>
    <script src="story.js?v=20260220-2"></script>
    <script src="achievement.js?v=20260220-2"></script>
    <script src="tutorial-content.js?v=20260220-2"></script>
    <script src="tutorial-flow.js?v=20260220-2"></script>
    <script src="pages.js?v=20260220-2"></script>
    <script src="router.js?v=20260220-2"></script>
</body>
</html>
