<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Pal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cp-app" id="cpApp">
        <aside class="cp-sidebar" id="cpSidebar">
            <div class="cp-side-head">
                <div class="cp-side-title">Chess Pal</div>
            </div>

            <nav class="cp-nav" aria-label="Chess Pal navigation">
                <button class="cp-nav-btn is-active" type="button" data-route="/home">Home</button>
                <button class="cp-nav-btn" type="button" data-route="/mode">Mode</button>
                <button class="cp-nav-btn" type="button" data-route="/practice">Practice</button>
                <button class="cp-nav-btn" type="button" data-route="/pal">Pal</button>
                <button class="cp-nav-btn" type="button" data-route="/storage">Storage</button>
                <button class="cp-nav-btn" type="button" data-route="/shop">Shop</button>
                <button class="cp-nav-btn" type="button" data-route="/settings">Setting</button>
            </nav>

            <div class="cp-sidebar-bottom">
                <!-- API status removed (no Disconnected badge) -->
            </div>
        </aside>

        <main class="cp-main" id="cpMain">
            <div class="cp-main-topbar">
                <button class="cp-hamburger" id="cpHamburger" type="button" aria-label="Toggle menu">☰</button>
                <div class="cp-main-title" id="cpMainTitle">Home</div>
                <div class="cp-top-tools" id="cpTopTools"></div>
            </div>
            <div class="cp-top-popovers" id="cpTopPopovers"></div>
            <div id="cpPageContainer" class="cp-container"></div>
        </main>
    </div>

    <div class="cp-overlay" id="cpOverlay" aria-hidden="true"></div>

    <script src="config.js"></script>
    <script src="chess-pal.js"></script>
    <script src="pages.js"></script>
    <script src="router.js"></script>
</body>
</html>
