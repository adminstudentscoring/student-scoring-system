<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* ws://localhost:* wss://localhost:*; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* wss://localhost:*;">
    <title>Game Zone</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/game/game-styles.css">
    <link rel="stylesheet" href="/game/running-queen.css">
    <link rel="stylesheet" href="/game/royal-exchange.css">
    <link rel="stylesheet" href="/game/no-blunder.css">
    <link rel="stylesheet" href="/game/hope-mate.css">
    <link rel="stylesheet" href="/game/blunders/blunders.css">
    <link rel="stylesheet" href="/game/tactics-fighter/tactics-fighter.css">
    <link rel="stylesheet" href="/game/maze-runner/maze-runner.css">
    <link rel="stylesheet" href="/game/vchess-platform/vchess-platform.css">
    <link rel="stylesheet" href="/game/vchess-platform/normal-chess.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Full-bleed layout for fixed-sidebar apps */
        body.game-is-maze-runner {
            padding: 0;
        }
        body.game-is-maze-runner .game-window-container {
            border-radius: 0;
            padding: 0;
            min-height: 100vh;
        }
        body.game-is-maze-runner .game-area-content {
            padding: 0;
        }
        .game-window-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            min-height: calc(100vh - 40px);
        }
        .game-area-content {
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="game-window-container">
        <div class="game-area-content" id="gameAreaContent"></div>
    </div>
    <script>
        console.log('Game window opened');
        window.API_BASE = '/api';

        function loadScript(src, opts = {}) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                if (opts && opts.type) script.type = opts.type;
                script.onload = () => resolve();
                script.onerror = (error) => reject(error);
                document.body.appendChild(script);
            });
        }

        function showError(message) {
            const container = document.getElementById('gameAreaContent');
            if (container) {
                container.innerHTML = `
                    <div style="padding: 20px; text-align: center; color: red;">
                        <h3>Error</h3>
                        <p>${message}</p>
                    </div>
                `;
            }
        }

        (async function initializeGameWindow() {
            const params = new URLSearchParams(window.location.search);
            const gameKey = params.get('game') || 'monsterFight';
            const content = document.getElementById('gameAreaContent');
            if (!content) {
                return;
            }

            try {
                // Allow per-game layout overrides via CSS (avoid outer paddings for fixed-sidebar apps like Blunders/Running Queen/VCP)
                document.body.classList.toggle('game-is-blunders', gameKey === 'blunders');
                document.body.classList.toggle('game-is-running-queen', gameKey === 'runningQueen');
                document.body.classList.toggle('game-is-tactics-fighter', gameKey === 'tacticsFighter');
                document.body.classList.toggle('game-is-maze-runner', gameKey === 'mazeRunner');
                document.body.classList.toggle('game-is-vcp', gameKey === 'vChessPlatform');

                if (gameKey === 'runningQueen') {
                    content.innerHTML = `
                        <div id="runningQueenGame" class="running-queen-root">
                            <h2>♕ Running Queen</h2>
                            <p>Loading game...</p>
                        </div>
                    `;
                    try {
                        const storedPlayers = localStorage.getItem('runningQueenPlayers');
                        if (storedPlayers) {
                            window.runningQueenPlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore running queen players from storage:', error);
                    }
                    await loadScript('/game/running-queen.js');
                    if (window.initRunningQueen) {
                        window.initRunningQueen();
                    } else {
                        showError('Running Queen script loaded but init function missing.');
                    }
                } else if (gameKey === 'royalExchange') {
                    content.innerHTML = `
                        <div id="royalExchangeGame" class="royal-exchange-root">
                            <h2>♘ Royal Exchange</h2>
                            <p>Loading game...</p>
                        </div>
                    `;
                    try {
                        const storedPlayers = localStorage.getItem('royalExchangePlayers');
                        if (storedPlayers) {
                            window.royalExchangePlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore royal exchange players from storage:', error);
                    }
                    await loadScript('/game/royal-exchange.js');
                    if (window.initRoyalExchange) {
                        window.initRoyalExchange();
                    } else {
                        showError('Royal Exchange script loaded but init function missing.');
                    }
                } else if (gameKey === 'puzzleMonsterFight') {
                    content.innerHTML = `
                        <div id="puzzleMonsterFightGame" class="puzzle-monster-root">
                            <h2>🧩 Puzzle Monster Fight</h2>
                            <p>Loading game...</p>
                        </div>
                    `;
                    try {
                        const storedPlayers = localStorage.getItem('puzzleMonsterFightPlayers');
                        if (storedPlayers) {
                            window.puzzleMonsterFightPlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore puzzle monster fight players from storage:', error);
                    }
                    await loadScript('/game/puzzle-monster-fight.js');
                    if (window.initPuzzleMonsterFight) {
                        window.initPuzzleMonsterFight();
                    } else {
                        showError('Puzzle Monster Fight script loaded but init function missing.');
                    }
                } else if (gameKey === 'noBlunder') {
                    content.innerHTML = `
                        <div id="noBlunderRoot" class="no-blunder-root">
                            <h2>🛡️ No Blunder</h2>
                            <p>Loading game...</p>
                        </div>
                    `;
                    try {
                        const storedPlayers = localStorage.getItem('noBlunderPlayers');
                        if (storedPlayers) {
                            window.noBlunderPlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore no blunder players from storage:', error);
                    }
                    await loadScript('/game/no-blunder.js');
                    if (window.initNoBlunder) {
                        window.initNoBlunder();
                    } else {
                        showError('No Blunder script loaded but init function missing.');
                    }
                } else if (gameKey === 'hopeMate') {
                    content.innerHTML = `
                        <div id="hopeMateRoot" class="hope-mate-root">
                            <h2>✨ Hope Mate</h2>
                            <p>Loading game...</p>
                        </div>
                    `;
                    try {
                        const storedPlayers = localStorage.getItem('hopeMatePlayers');
                        if (storedPlayers) {
                            window.hopeMatePlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore hope mate players from storage:', error);
                    }
                    await loadScript('/game/hope-mate.js');
                    if (window.initHopeMate) {
                        window.initHopeMate();
                    } else {
                        showError('Hope Mate script loaded but init function missing.');
                    }
                } else if (gameKey === 'blunders') {
                    content.innerHTML = `
                        <div id="blundersRoot" class="blunders-root">
                            <h2>💥 Blunders</h2>
                            <p>Loading game...</p>
                        </div>
                    `;
                    // Support teacher vs student rendering via querystring.
                    const blRole = String(params.get('role') || '');
                    if (blRole) {
                        try { localStorage.setItem('blundersRole', blRole); } catch {}
                        try { window.blundersRole = blRole; } catch {}
                    }
                    try {
                        const storedPlayers = localStorage.getItem('blundersPlayers');
                        if (storedPlayers) {
                            window.blundersPlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore blunders players from storage:', error);
                    }
                    await loadScript('/game/blunders/core.js');
                    await loadScript('/game/blunders/teacher.js');
                    await loadScript('/game/blunders/challenge.js');
                    await loadScript('/game/blunders/student.js');
                    await loadScript('/game/blunders/blunders.js');
                    if (window.initBlunders) {
                        window.initBlunders();
                    } else {
                        showError('Blunders script loaded but init function missing.');
                    }
                } else if (gameKey === 'tacticsFighter') {
                    content.innerHTML = `
                        <div id="tacticsFighterRoot" class="tactics-fighter-root">
                            <h2>⚔️ Tactics Fighter</h2>
                            <p>Loading...</p>
                        </div>
                    `;
                    try {
                        const storedPlayers = localStorage.getItem('tacticsFighterPlayers');
                        if (storedPlayers) {
                            window.tacticsFighterPlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore tactics fighter players from storage:', error);
                    }
                    // Tactics Fighter is located under /game/tactics-fighter/
                    // Load core first, then the main file.
                    await loadScript('/game/tactics-fighter/core.js');
                    await loadScript('/game/tactics-fighter/tactics-fighter.js');
                    if (window.initTacticsFighter) {
                        window.initTacticsFighter();
                    } else {
                        showError('Tactics Fighter script loaded but init function missing.');
                    }
                } else if (gameKey === 'mazeRunner') {
                    content.innerHTML = `
                        <div id="mazeRunnerRoot" class="maze-runner-root">
                            <h2>🧩 Maze Runner</h2>
                            <p>Loading...</p>
                        </div>
                    `;
                    try {
                        const storedPlayers = localStorage.getItem('mazeRunnerPlayers');
                        if (storedPlayers) {
                            window.mazeRunnerPlayers = JSON.parse(storedPlayers);
                        }
                    } catch (error) {
                        console.warn('Unable to restore maze runner players from storage:', error);
                    }
                    await loadScript('/game/maze-runner/core.js');
                    await loadScript('/game/maze-runner/maze-runner.js');
                    if (window.initMazeRunner) {
                        window.initMazeRunner();
                    } else {
                        showError('Maze Runner script loaded but init function missing.');
                    }
                } else if (gameKey === 'vChessPlatform') {
                    content.innerHTML = `
                        <div id="vChessPlatformRoot" class="vchess-platform-root">
                            <h2>🌐 V.Chess Platform</h2>
                            <p>Loading platform...</p>
                        </div>
                    `;
                    // Pass role via querystring or localStorage; keep localStorage for consistency.
                    const role = params.get('role') || '';
                    if (role) {
                        try { localStorage.setItem('vChessPlatformRole', role); } catch {}
                    }
                    await loadScript('/game/vchess-platform/normal-chess.js');
                    await loadScript('/game/vchess-platform/vchess-platform.js');
                    if (window.initVChessPlatform) {
                        window.initVChessPlatform();
                    } else {
                        showError('V.Chess Platform script loaded but init function missing.');
                    }
                } else {
                    content.innerHTML = `
                        <div id="monsterFightGame">
                            <h2>🐉 Monster Fight</h2>
                            <p>Loading game...</p>
                        </div>
                    `;
                    await loadScript('/game/game.js');
                    if (window.initMonsterFight) {
                        window.initMonsterFight();
                    } else {
                        showError('Monster Fight script loaded but init function missing.');
                    }
                }
            } catch (error) {
                console.error('Game window init error:', error);
                showError('Failed to load game scripts. See console for details.');
            }
        })();
    </script>
</body>
</html>
