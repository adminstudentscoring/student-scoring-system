        }

        }
        .class-view-page .monster-avatar {

        }
        .class-view-page .class-view-footer.cv-footer-apple {

            position: relative !important;
            height: 24px !important;
            border-radius: 8px !important;

        }
        .class-view-page .progress-fill {

            left: 0 !important;
            top: 0 !important;
            bottom: 0 !important;

        }

            z-index: 2 !important;
            display: flex !important;

<body class="class-view-page">
    <div class="class-view-container">
        <div class="class-view-titlebar" id="titlebar">
            <div class="titlebar-left">
                <span class="titlebar-title">Class View</span>
            </div>
            <div class="titlebar-buttons">
                <button class="titlebar-btn minimize" id="minimizeBtn" title="Minimize">−</button>
                <button class="titlebar-btn close" id="closeBtn" title="Close">×</button>
            </div>
        </div>
        <div class="class-view-content" id="classViewContent">
            <!-- Challenge Mode Section -->
            <div class="challenge-section" id="challengeSection">
                <div class="challenge-header">
                    <div class="challenge-level">
                        <div class="level-info">
                            <div class="level-name" id="levelName">Level 1</div>
                            <div class="level-reward">+<span id="levelReward">10</span> points</div>
                        </div>
                    </div>
                </div>
                <div class="monster-hp-container">
                    <div class="monster-display" id="monsterDisplay">
                        <div class="monster-image-slot">
                            <img class="monster-avatar" id="monsterAvatar" alt="">
                            <p class="monster-image-unavailable" id="monsterImageUnavailable" aria-live="polite"></p>
                        </div>
                        <div class="monster-name" id="monsterName">Slime</div>
                    </div>
                    <div class="hp-bar-container">
                        <div class="hp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="200" aria-valuenow="200" id="hpBarTrack">
                            <div class="hp-fill" id="hpFill" style="width: 100%"></div>
                            <span class="hp-bar-text" id="hpBarText">200/200</span>
                        </div>
                    </div>
                    <div class="attack-animation-area" id="attackAnimationArea"></div>
                </div>
            </div>
            
            <!-- Students List Section -->
            <div class="students-section-header">
                <input type="text" id="classViewSearch" class="cv-search-field" placeholder="Search student..." autocomplete="off">
            </div>
            
            <div class="students-section" id="studentsSection">
                <div class="no-students">No students selected. Please select students from the main dashboard.</div>
            </div>
        </div>

        <!-- Bottom actions (collapsible) -->
        <div class="class-view-footer cv-footer-apple" id="classViewFooter">
            <button type="button" class="cv-footer-toggle" id="cvFooterToggle" aria-expanded="true" aria-controls="cvFooterPanel">
                <span class="cv-footer-toggle-label">Tools</span>
                <span class="cv-footer-chevron" aria-hidden="true"></span>
            </button>
            <div class="cv-footer-panel" id="cvFooterPanel">
                <button type="button" id="saveProgressBtn" class="cv-footer-btn" title="Save Progress">Save</button>
                <button type="button" id="loadProgressBtn" class="cv-footer-btn" title="Load Progress">Load</button>
                <button type="button" id="resetChallengeBtn" class="cv-footer-btn" title="Reset Challenge">Reset</button>
            </div>
        </div>
    </div>

    <!-- Save Progress Modal -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💾 Save Challenge Progress</h2>
                <span class="modal-close" id="saveModalClose">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="saveDay">Day:</label>
                    <select id="saveDay" required>
                        <option value="">Select day...</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="saveTime">Time:</label>
                    <select id="saveTime" required>
                        <option value="">Select time...</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button id="confirmSaveBtn" class="btn btn-success">Save</button>
                    <button id="cancelSaveBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Progress Modal -->
    <div id="loadModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>📂 Load Challenge Progress</h2>
                <span class="modal-close" id="loadModalClose">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Bucket UI: pick a day first, then pick a saved time -->
                <div id="loadBucketDays" class="cv-save-bucket-grid">
                    <!-- Filled by JS -->
                </div>

                <div id="loadBucketTimesWrap" style="display:none;">
                    <div class="cv-save-bucket-head">
                        <button type="button" id="loadBucketBackBtn" class="cv-save-bucket-back">← Back</button>
                        <div id="loadBucketDayTitle" class="cv-save-bucket-title"></div>
                    </div>
                    <div class="search-group" id="loadBucketSearchGroup">
                        <input type="text" id="saveSearchInput" placeholder="🔍 Search times...">
                    </div>
                    <div id="loadBucketTimesList" class="saves-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js?v=cv20260403"></script>
    <script>
        // Check authentication - Class View is for teachers
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.authUtils.requireRole('teacher')) {
                // Redirect will happen in requireRole
            }
        });
    </script>
    <script src="class-view.js?v=cv20260403"></script>
</body>
</html>
