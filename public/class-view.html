<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* ws://localhost:* wss://localhost:*; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* wss://localhost:* https://cloudflareinsights.com https://*.cloudflareinsights.com;">
    <title>Class View - Student Scoring System</title>
    <!-- Bump ?v= when changing class-view UI so CDN/browser pick up new CSS/JS -->
    <link rel="stylesheet" href="styles.css?v=cv20260405">
    <link rel="stylesheet" href="class-view.css?v=cv20260405">
    <!-- Critical fallback if class-view.css is stale, blocked, or wrong path -->
    <style id="class-view-critical-fallback">
        body.class-view-page {
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: #0d0d0f !important;
            color: #f5f5f7 !important;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif !important;
        }
        .class-view-page .class-view-container { background: #0d0d0f !important; box-shadow: 0 0 0 1px rgba(255,255,255,0.08) !important; }
        .class-view-page .class-view-content { background: #0d0d0f !important; }
        .class-view-page .challenge-section {
            background: #0d0d0f !important;
            padding: 4px 10px 4px !important;
        }
        .class-view-page .challenge-header-inner {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: space-between !important;
            width: 100% !important;
            gap: 8px !important;
            margin-bottom: 2px !important;
        }
        .class-view-page .level-name { color: #f5f5f7 !important; }
        .class-view-page .level-reward { color: #32d74b !important; text-align: right !important; white-space: nowrap !important; }
        .class-view-page .monster-hp-container {
            background: #1c1c1e !important;
            padding: 6px 8px 8px !important;
            border-radius: 12px !important;
        }
        .class-view-page .monster-image-slot {
            position: relative !important;
            min-height: 140px !important;
        }
        .class-view-page .monster-avatar { width: 120px !important; height: 120px !important; }
        .class-view-page .monster-hp-overlay {
            position: absolute !important;
            left: 8px !important;
            right: 8px !important;
            bottom: 4px !important;
            z-index: 4 !important;
        }
        .class-view-page .monster-display { margin-bottom: 0 !important; }
        .class-view-page .hp-bar {
            height: 24px !important;
            border-radius: 8px !important;
            background: rgba(0,0,0,0.45) !important;
        }
        .class-view-page .hp-fill { z-index: 0 !important; }
        .class-view-page .hp-bar-text {
            position: relative !important;
            z-index: 2 !important;
            height: 24px !important;
            color: #fff !important;
        }
        .class-view-page .students-section-header { background: #0d0d0f !important; padding: 2px 10px 2px !important; }
        .class-view-page .students-section { background: #0d0d0f !important; padding: 2px 10px 6px !important; }
        .class-view-page .cv-search-field {
            padding: 8px 12px !important;
            border-radius: 10px !important;
            background: rgba(255,255,255,0.1) !important;
            color: #f5f5f7 !important;
        }
        .class-view-page .class-view-footer.cv-footer-apple {
            display: flex !important;
            flex-direction: column !important;
            background: rgba(28, 28, 30, 0.94) !important;
            border-top: 0.5px solid rgba(255,255,255,0.12) !important;
        }
        .class-view-page .cv-footer-toggle {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
            padding: 8px 12px !important;
            border: none !important;
            background: transparent !important;
            color: #f5f5f7 !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            cursor: pointer !important;
        }
        .class-view-page .cv-footer-chevron {
            display: inline-block !important;
            width: 8px !important;
            height: 8px !important;
            border-right: 2px solid rgba(245, 245, 247, 0.9) !important;
            border-bottom: 2px solid rgba(245, 245, 247, 0.9) !important;
            transform: rotate(45deg) !important;
            margin-top: -4px !important;
        }
        .class-view-page .class-view-footer.cv-footer-collapsed .cv-footer-chevron {
            transform: rotate(-135deg) !important;
            margin-top: 2px !important;
        }
        .class-view-page .cv-footer-panel {
            display: flex !important;
            justify-content: center !important;
            gap: 8px !important;
            flex-wrap: wrap !important;
            padding: 0 10px 8px !important;
        }
        .class-view-page .class-view-footer.cv-footer-collapsed .cv-footer-panel {
            display: none !important;
        }
        .class-view-page .cv-footer-btn {
            flex: 1 1 auto !important;
            max-width: 120px !important;
            padding: 8px 10px !important;
            border-radius: 12px !important;
            border: none !important;
            background: rgba(255,255,255,0.12) !important;
            color: #f5f5f7 !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
        }
        .class-view-page .class-add-btn {
            background: rgba(28, 28, 30, 0.55) !important;
            color: #f5f5f7 !important;
            border: 0.5px solid rgba(255, 255, 255, 0.14) !important;
        }
        .class-view-page .progress-bar-label {
            position: absolute !important;
            left: 0 !important; right: 0 !important; top: 0 !important; bottom: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 2 !important;
            height: auto !important;
        }
        .class-view-page .class-student-card-badge-bg::before {
            content: '' !important;
            position: absolute !important;
            inset: 0 !important;
            border-radius: inherit !important;
            background-image: var(--student-badge) !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-size: 56% auto !important;
            opacity: 0.3 !important;
            z-index: 0 !important;
            pointer-events: none !important;
        }
        .class-view-page .class-student-card > * { position: relative !important; z-index: 1 !important; }
    </style>
</head>
<body class="class-view-page">
    <div class="class-view-container">
        <div class="class-view-content" id="classViewContent">
            <!-- Challenge Mode Section -->
            <div class="challenge-section" id="challengeSection">
                <div class="challenge-header">
                    <div class="challenge-header-inner">
                        <div class="level-info">
                            <div class="level-name" id="levelName">Level 1</div>
                        </div>
                        <div class="level-reward-wrap">
                            <div class="level-reward">+<span id="levelReward">10</span> points</div>
                        </div>
                    </div>
                </div>
                <div class="monster-hp-container">
                    <div class="monster-display" id="monsterDisplay">
                        <div class="monster-image-slot">
                            <img class="monster-avatar" id="monsterAvatar" alt="">
                            <p class="monster-image-unavailable" id="monsterImageUnavailable" aria-live="polite"></p>
                            <div class="monster-hp-overlay">
                                <div class="hp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="200" aria-valuenow="200" id="hpBarTrack">
                                    <div class="hp-fill" id="hpFill" style="width: 100%"></div>
                                    <span class="hp-bar-text" id="hpBarText">200/200</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="attack-animation-area" id="attackAnimationArea"></div>
                </div>
            </div>
            
            <!-- Students List Section -->
            <div class="students-section-header">
                <input type="text" id="classViewSearch" class="cv-search-field" placeholder="Search student..." autocomplete="off">
            </div>
            
            <div class="students-section" id="studentsSection">
                <div class="no-students">No students selected. Please select students from the main dashboard.</div>
            </div>
        </div>

        <!-- Bottom actions (collapsible) -->
        <div class="class-view-footer cv-footer-apple" id="classViewFooter">
            <button type="button" class="cv-footer-toggle" id="cvFooterToggle" aria-expanded="true" aria-controls="cvFooterPanel">
                <span class="cv-footer-toggle-label">Tools</span>
                <span class="cv-footer-chevron" aria-hidden="true"></span>
            </button>
            <div class="cv-footer-panel" id="cvFooterPanel">
                <button type="button" id="saveProgressBtn" class="cv-footer-btn" title="Save Progress">Save</button>
                <button type="button" id="loadProgressBtn" class="cv-footer-btn" title="Load Progress">Load</button>
                <button type="button" id="resetChallengeBtn" class="cv-footer-btn" title="Reset Challenge">Reset</button>
            </div>
        </div>
    </div>

    <!-- Save Progress Modal -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💾 Save Challenge Progress</h2>
                <span class="modal-close" id="saveModalClose">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="saveDay">Day:</label>
                    <select id="saveDay" required>
                        <option value="">Select day...</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="saveTime">Time:</label>
                    <select id="saveTime" required>
                        <option value="">Select time...</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button id="confirmSaveBtn" class="btn btn-success">Save</button>
                    <button id="cancelSaveBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Progress Modal -->
    <div id="loadModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>📂 Load Challenge Progress</h2>
                <span class="modal-close" id="loadModalClose">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Bucket UI: pick a day first, then pick a saved time -->
                <div id="loadBucketDays" class="cv-save-bucket-grid">
                    <!-- Filled by JS -->
                </div>

                <div id="loadBucketTimesWrap" style="display:none;">
                    <div class="cv-save-bucket-head">
                        <button type="button" id="loadBucketBackBtn" class="cv-save-bucket-back">← Back</button>
                        <div id="loadBucketDayTitle" class="cv-save-bucket-title"></div>
                    </div>
                    <div class="search-group" id="loadBucketSearchGroup">
                        <input type="text" id="saveSearchInput" placeholder="🔍 Search times...">
                    </div>
                    <div id="loadBucketTimesList" class="saves-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js?v=cv20260405"></script>
    <script>
        // Check authentication - Class View is for teachers
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.authUtils.requireRole('teacher')) {
                // Redirect will happen in requireRole
            }
        });
    </script>
    <script src="class-view.js?v=cv20260405"></script>
</body>
</html>
