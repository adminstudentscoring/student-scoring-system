<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Management - Student Scoring System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .org-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .org-header-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .org-header h1 {
            margin: 0;
        }
        .org-name {
            font-size: 0.9rem;
            color: #666;
            font-weight: normal;
            margin-left: 0;
        }
        .user-info {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 8px;
        }
        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            border-radius: 6px;
        }
        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 1);
        }
        .tab.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            border-bottom-color: #fff;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        /* Student card button area - ensure buttons don't overflow */
        .student-card-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .student-card-actions input[type="number"] {
            flex: 1;
            min-width: 60px;
            max-width: 80px;
            padding: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            text-align: center;
        }
        .student-card-actions input[type="number"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .student-card-actions button {
            flex: 1;
            min-width: 60px;
            padding: 5px 8px;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .student-card-actions .btn-danger {
            min-width: 55px;
        }
        /* Settings Styles */
        .settings-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .settings-category {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .settings-category h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-category .category-description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .settings-group {
            margin-bottom: 15px;
        }
        .settings-group label {
            display: block;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }
        .settings-group input,
        .settings-group select,
        .settings-group textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }
        .settings-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        .settings-group .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .settings-group .help-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }
        .settings-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .settings-actions button {
            flex: 1;
        }
        .preview-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }
        .preview-panel h4 {
            margin-top: 0;
            color: #ffd700;
        }
        .settings-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .settings-tab {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
        }
        .settings-tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .settings-tab.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
            color: #fff;
            font-weight: bold;
        }
        .settings-category-content {
            display: none;
        }
        .settings-category-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="user-info">
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>
    <div class="container">
        <header>
            <div class="org-header">
                <div class="org-header-left">
                    <h1>🏢 Organization Management</h1>
                    <span class="org-name" id="orgName">Loading...</span>
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('teachers')">👨‍🏫 Teacher Management</button>
            <button class="tab" onclick="switchTab('students')">👥 Student Management</button>
            <button class="tab" onclick="switchTab('settings')">⚙️ Settings</button>
        </div>

        <!-- Teachers Tab -->
        <div id="teachersTab" class="tab-content active">
            <section class="card">
                <h2>Create New Teacher</h2>
                <form id="createTeacherForm" onsubmit="createTeacher(event)">
                    <div class="form-group">
                        <label>Teacher Name:</label>
                        <input type="text" id="teacherName" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Teacher ID:</label>
                            <input type="text" id="teacherId" required>
                        </div>
                        <div class="form-group">
                            <label>Gender:</label>
                            <select id="teacherGender" required>
                                <option value="">Please select</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Username:</label>
                            <input type="text" id="teacherUsername" required>
                        </div>
                        <div class="form-group">
                            <label>Password:</label>
                            <input type="password" id="teacherPassword" required minlength="6">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Teacher</button>
                </form>
            </section>

            <section class="card">
                <h2>Teacher List</h2>
                <div id="teachersList">
                    <p>Loading...</p>
                </div>
            </section>
        </div>

        <!-- Students Tab -->
        <div id="studentsTab" class="tab-content">
            <section class="card">
                <h2>Create New Student</h2>
                <form id="createStudentForm" onsubmit="createStudent(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Student Name:</label>
                            <input type="text" id="studentName" required>
                        </div>
                        <div class="form-group">
                            <label>Student ID:</label>
                            <input type="text" id="studentId" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Student</button>
                </form>
            </section>

            <section class="card">
                <h2>Student List</h2>
                <div id="studentsList">
                    <p>Loading...</p>
                </div>
            </section>
        </div>

        <!-- Settings Tab -->
        <div id="settingsTab" class="tab-content">
            <div id="settingsContainer">
                <p>Loading settings...</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="organization-settings.js"></script>
    <script>
        // Check authentication
        if (!window.authUtils.requireRole('organization')) {
            // Redirect will happen in requireRole
        }

        let currentUser = null;

        // Load user info
        async function loadUserInfo() {
            try {
                const response = await window.authUtils.authenticatedFetch('/auth/me');
                if (!response) return;
                
                const user = await response.json();
                currentUser = user;
                document.getElementById('orgName').textContent = user.name || user.email;
                
                // Load data
                loadTeachers();
                loadStudents();
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tab}Tab`).classList.add('active');
            
            // Load settings when switching to settings tab
            if (tab === 'settings') {
                loadSettings();
            }
        }

        async function createTeacher(event) {
            event.preventDefault();
            const name = document.getElementById('teacherName').value;
            const teacherId = document.getElementById('teacherId').value;
            const gender = document.getElementById('teacherGender').value;
            const username = document.getElementById('teacherUsername').value;
            const password = document.getElementById('teacherPassword').value;

            try {
                const response = await window.authUtils.authenticatedFetch('/organizations/teachers', {
                    method: 'POST',
                    body: JSON.stringify({ name, teacherId, gender, username, password })
                });

                if (!response) return;

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to create');
                }

                alert('Teacher created successfully!');
                document.getElementById('createTeacherForm').reset();
                loadTeachers();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function loadTeachers() {
            try {
                const response = await window.authUtils.authenticatedFetch('/organizations/teachers');
                if (!response) return;

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to load teachers');
                }

                const teachers = await response.json();
                
                // Ensure teachers is an array
                if (!Array.isArray(teachers)) {
                    console.error('Invalid response format:', teachers);
                    throw new Error('Invalid response format');
                }

                if (teachers.length === 0) {
                    document.getElementById('teachersList').innerHTML = '<p>No teachers yet</p>';
                    return;
                }

                const html = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;">
                        ${teachers.map(teacher => `
                            <div class="card" style="padding: 15px;">
                                <h4>${teacher.name || 'Unnamed'}</h4>
                                <p>Teacher ID: ${teacher.teacherId || 'N/A'}</p>
                                <p>Username: ${teacher.username || teacher.email}</p>
                                <p>Gender: ${teacher.gender === 'male' ? 'Male' : teacher.gender === 'female' ? 'Female' : 'N/A'}</p>
                                <p>Created: ${new Date(teacher.createdAt).toLocaleString('en-US')}</p>
                                <div style="margin-top: 10px; display: flex; gap: 10px;">
                                    <button class="btn btn-primary" onclick="assignStudents('${teacher.id}', '${teacher.name}')" style="flex: 1;">Assign Students</button>
                                    <button class="btn btn-danger" onclick="deleteTeacher('${teacher.id}', '${teacher.name}')" style="flex: 1;">Delete</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <p style="margin-top: 15px; color: #666;">Total: ${teachers.length} teacher(s)</p>
                `;
                document.getElementById('teachersList').innerHTML = html;
            } catch (error) {
                console.error('Error loading teachers:', error);
                document.getElementById('teachersList').innerHTML = '<p>Failed to load</p>';
            }
        }

        async function createStudent(event) {
            event.preventDefault();
            const name = document.getElementById('studentName').value;
            const studentId = document.getElementById('studentId').value;

            try {
                const response = await window.authUtils.authenticatedFetch('/organizations/students', {
                    method: 'POST',
                    body: JSON.stringify({ name, studentId })
                });

                if (!response) return;

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to create');
                }

                alert('Student created successfully!');
                document.getElementById('createStudentForm').reset();
                loadStudents();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function loadStudents() {
            try {
                const response = await window.authUtils.authenticatedFetch('/students');
                if (!response) return;

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to load students');
                }

                const data = await response.json();
                const students = Array.isArray(data) ? data : (data.students || []);

                if (students.length === 0) {
                    document.getElementById('studentsList').innerHTML = '<p>No students yet</p>';
                    return;
                }

                const html = `
                    <div class="students-grid">
                        ${students.map(student => `
                            <div class="student-card">
                                <h3>${student.name}</h3>
                                <p>ID: ${student.studentId}</p>
                                <p>Score: <span id="score-${student.id}">${student.score || 0}</span></p>
                                <p>Level: ${student.level || 1}</p>
                                <div class="student-card-actions">
                                    <input type="number" id="score-input-${student.id}" value="${student.score || 0}" min="0">
                                    <button class="btn btn-primary" onclick="updateStudentScore('${student.id}')">Update</button>
                                    <button class="btn btn-danger" onclick="deleteStudent('${student.id}', '${student.name}')">Delete</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                document.getElementById('studentsList').innerHTML = html;
            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('studentsList').innerHTML = '<p>Failed to load</p>';
            }
        }

        async function deleteTeacher(teacherId, teacherName) {
            if (!confirm(`Are you sure you want to delete teacher "${teacherName}"? This action cannot be undone.`)) {
                return;
            }

            try {
                const response = await window.authUtils.authenticatedFetch(`/organizations/teachers/${teacherId}`, {
                    method: 'DELETE'
                });

                if (!response) return;

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to delete teacher');
                }

                alert('Teacher deleted successfully!');
                loadTeachers();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteStudent(studentId, studentName) {
            if (!confirm(`Are you sure you want to delete student "${studentName}"? This action cannot be undone.`)) {
                return;
            }

            try {
                const response = await window.authUtils.authenticatedFetch(`/students/${studentId}`, {
                    method: 'DELETE'
                });

                if (!response) return;

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to delete student');
                }

                alert('Student deleted successfully!');
                loadStudents();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function updateStudentScore(studentId) {
            const scoreInput = document.getElementById(`score-input-${studentId}`);
            const newScore = parseInt(scoreInput.value, 10);

            if (isNaN(newScore) || newScore < 0) {
                alert('Please enter a valid score (0 or greater)');
                return;
            }

            try {
                const response = await window.authUtils.authenticatedFetch(`/students/${studentId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ score: newScore })
                });

                if (!response) return;

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to update score');
                }

                const updatedStudent = await response.json();
                document.getElementById(`score-${studentId}`).textContent = updatedStudent.score || 0;
                alert('Score updated successfully!');
                loadStudents(); // Reload to update level and rank
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function assignStudents(teacherId, teacherName) {
            try {
                // Load all students
                const studentsResponse = await window.authUtils.authenticatedFetch('/students');
                if (!studentsResponse || !studentsResponse.ok) {
                    throw new Error('Failed to load students');
                }
                const allStudents = await studentsResponse.json();

                // Load currently assigned students
                const assignedResponse = await window.authUtils.authenticatedFetch(`/organizations/teachers/${teacherId}/students`);
                if (!assignedResponse || !assignedResponse.ok) {
                    throw new Error('Failed to load assigned students');
                }
                const assignedData = await assignedResponse.json();
                const assignedIds = new Set(assignedData.assignedStudentIds || []);

                // Create modal
                const modal = document.createElement('div');
                modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;';
                modal.innerHTML = `
                    <div class="card" style="max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative;">
                        <h2>Assign Students to ${teacherName}</h2>
                        <div style="margin-bottom: 15px;">
                            <input type="text" id="studentSearch" placeholder="Search students..." style="width: 100%; padding: 8px; margin-bottom: 10px;">
                            <div id="studentCheckboxes" style="max-height: 400px; overflow-y: auto;">
                                ${allStudents.map(student => `
                                    <label style="display: block; padding: 8px; border-bottom: 1px solid #eee;">
                                        <input type="checkbox" value="${student.id}" ${assignedIds.has(student.id) ? 'checked' : ''} style="margin-right: 10px;">
                                        ${student.name} (ID: ${student.studentId})
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-primary" onclick="saveStudentAssignment('${teacherId}')" style="flex: 1;">Save</button>
                            <button class="btn btn-secondary" onclick="closeAssignModal()" style="flex: 1;">Cancel</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                // Search functionality
                const searchInput = modal.querySelector('#studentSearch');
                const checkboxes = modal.querySelectorAll('#studentCheckboxes input[type="checkbox"]');
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    checkboxes.forEach(checkbox => {
                        const label = checkbox.parentElement;
                        const text = label.textContent.toLowerCase();
                        label.style.display = text.includes(searchTerm) ? 'block' : 'none';
                    });
                });

                window.currentAssignModal = modal;
                window.currentTeacherId = teacherId;
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function saveStudentAssignment(teacherId) {
            const modal = window.currentAssignModal;
            const checkboxes = modal.querySelectorAll('input[type="checkbox"]:checked');
            const studentIds = Array.from(checkboxes).map(cb => cb.value);

            try {
                const response = await window.authUtils.authenticatedFetch('/organizations/assign-students', {
                    method: 'POST',
                    body: JSON.stringify({ teacherId, studentIds })
                });

                if (!response) return;

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to assign students');
                }

                alert('Students assigned successfully!');
                closeAssignModal();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function closeAssignModal() {
            if (window.currentAssignModal) {
                document.body.removeChild(window.currentAssignModal);
                window.currentAssignModal = null;
                window.currentTeacherId = null;
            }
        }

        function logout() {
            window.authUtils.logout();
        }

        // Settings functions are now in organization-settings.js

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
        });
    </script>
</body>
</html>
