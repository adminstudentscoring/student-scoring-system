<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Scoring System - Redirecting...</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p style="text-align:center; margin-top:40px; color:#666;">Redirecting&hellip;</p>
    <script src="auth.js?v=20260503-tf-tree"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const user = window.authUtils.getCurrentUser();
            if (user) {
                switch(user.role) {
                    case 'admin':
                        window.location.replace('/admin.html');
                        break;
                    case 'organization':
                        window.location.replace('/organization.html');
                        break;
                    case 'teacher':
                        window.location.replace('/teacher.html');
                        break;
                    default:
                        window.location.replace('/login.html');
                        break;
                }
            } else {
                window.location.replace('/login.html');
            }
        });
    </script>
</body>
</html>
