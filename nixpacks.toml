[phases.setup]
# Railway defaults to the latest Node. Pin to a stable LTS for production deploys.
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
# This repository is a pnpm workspace and the runtime start command depends on tsx.
# `npm ci --omit=dev` fails on `workspace:*` deps and also drops the tsx runtime.
cmds = ["pnpm install --frozen-lockfile"]

[start]
cmd = "pnpm start"


